<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Lanes — a resource timeline for Vue 3</title>
        <meta
            name="description"
            content="Rows of people, rooms or machines; a day or week axis across the top; bars you can drag, stretch and connect. 7.3 kB gzipped, no dependencies, your data stays yours."
        />
        <link rel="canonical" href="https://polkilof.github.io/lanesjs/" />

        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://polkilof.github.io/lanesjs/" />
        <meta property="og:title" content="Lanes — a resource timeline for Vue 3" />
        <meta
            property="og:description"
            content="One component, not a suite. Virtualized rows, day and week axis, drag and drop as plugins. 7.3 kB gzipped."
        />
        <!--
            Абсолютна адреса, не відносна: превʼю збирає чужий сервер, і корінь
            він рахує від себе, а не від нас. Джерело картинки — scripts/og-card.html,
            звідти ж і розміри: картку 1200×630 вимагає summary_large_image, і без
            неї посилання розгортається порожньою рамкою.
        -->
        <meta property="og:image" content="https://polkilof.github.io/lanesjs/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Lanes — a resource timeline for Vue 3, shown as coloured bars on a dark grid"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="https://polkilof.github.io/lanesjs/og.png" />

        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cf0'/%3E%3Crect x='6' y='9' width='16' height='4' rx='2' fill='white'/%3E%3Crect x='10' y='19' width='16' height='4' rx='2' fill='white' fill-opacity='.6'/%3E%3C/svg%3E"
        />

        <!--
            Тема ставиться до першого малювання, інакше темна сторінка блимне
            світлою: скрипт у body виконався б уже після того, як браузер
            намалював фон.
        -->
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("lanes-theme");
                    var dark =
                        saved === "dark" ||
                        (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    document.documentElement.dataset.theme = dark ? "dark" : "light";
                } catch (error) {
                    document.documentElement.dataset.theme = "dark";
                }
            })();
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "SoftwareSourceCode",
                "name": "Lanes",
                "description": "A resource timeline component for Vue 3.",
                "codeRepository": "https://github.com/Polkilof/lanesjs",
                "programmingLanguage": "TypeScript",
                "runtimePlatform": "Vue 3",
                "url": "https://polkilof.github.io/lanesjs/"
            }
        </script>
    </head>

    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
